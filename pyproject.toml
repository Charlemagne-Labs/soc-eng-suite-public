[project]
name = "phishing-eval"
version = "0.1.0"
description = "Social engineering evaluation suite for Inspect AI"
requires-python = ">=3.10"
dependencies = [
    "inspect-ai>=0.3.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["social_engineering_eval*"]
